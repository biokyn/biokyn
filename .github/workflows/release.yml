name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vectors:fetch
      - run: npm run check
        env: { REQUIRE_OFFICIAL_VECTORS: '1' }
      - name: Publish with provenance
        run: |
          TAG=latest; case "${{ github.event.release.tag_name }}" in *-*) TAG=next;; esac
          npm publish --workspaces --access public --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.cdx.json
      - name: Attach SBOM
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
        env: { GH_TOKEN: '${{ github.token }}' }
