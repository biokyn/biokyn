name: Auto Label Issues and PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

  issues:
    types:
      - opened
      - reopened
      - edited

permissions:
  pull-requests: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      issues: write

    steps:
      - name: Create and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = context.eventName === "pull_request_target";
            const item = isPR
              ? context.payload.pull_request
              : context.payload.issue;

            const number = item.number;
            const title = item.title.toLowerCase();
            const author = item.user.login;
            const isDependabot = author === "dependabot[bot]";

            const labels = [
              {
                name: "pull-request",
                color: "1D76DB",
                description: "Pull request"
              },
              {
                name: "issue",
                color: "5319E7",
                description: "Issue"
              },
              {
                name: "dependencies",
                color: "0366D6",
                description: "Dependency updates"
              },
              {
                name: "bug",
                color: "D73A4A",
                description: "Bug fix or bug report"
              },
              {
                name: "enhancement",
                color: "A2EEEF",
                description: "New feature or improvement"
              },
              {
                name: "documentation",
                color: "0075CA",
                description: "Documentation changes"
              },
              {
                name: "security",
                color: "B60205",
                description: "Security-related changes"
              },
              {
                name: "tests",
                color: "7057FF",
                description: "Test-related changes"
              },
              {
                name: "draft",
                color: "FBCA04",
                description: "Draft pull request"
              }
            ];

            const selected = new Set([
              isPR ? "pull-request" : "issue"
            ]);

            if (
              isDependabot ||
              /\bdependenc(?:y|ies)\b|bump .* from|upgrade .* from/.test(title)
            ) {
              selected.add("dependencies");
            }

            if (/\b(fix|bug|patch|hotfix|broken|crash)\b/.test(title)) {
              selected.add("bug");
            }

            if (/\b(feat|feature|enhancement|add|request)\b/.test(title)) {
              selected.add("enhancement");
            }

            if (/\b(docs|documentation|readme)\b/.test(title)) {
              selected.add("documentation");
            }

            if (/\b(security|vulnerability|cve)\b/.test(title)) {
              selected.add("security");
            }

            if (/\b(test|tests|testing|ci)\b/.test(title)) {
              selected.add("tests");
            }

            if (isPR && item.draft) {
              selected.add("draft");
            }

            // Ensure selected labels exist.
            for (const label of labels) {
              if (!selected.has(label.name)) continue;

              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  ...label
                });
              } catch (error) {
                // GitHub returns 422 if the label already exists.
                if (error.status !== 422) {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: number,
              labels: [...selected]
            });

            core.info(
              `Applied labels to ${isPR ? "PR" : "issue"} #${number}: ` +
              [...selected].join(", ")
            );
